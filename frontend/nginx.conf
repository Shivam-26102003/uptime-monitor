server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any unknown path resolves to index.html so client routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy API calls to the backend container. The browser only ever
    # talks to this origin; nginx (inside the Docker network) can resolve
    # "backend" via Compose DNS. Trailing slash strips the /api prefix, so
    # /api/status -> backend:8000/status.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
