services:
  - type: web
    name: uptime-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: uptime-db
          property: connectionString
      - key: CHECK_INTERVAL_SECONDS
        value: "60"

databases:
  - name: uptime-db
    databaseName: uptime
    user: uptime
    plan: free
